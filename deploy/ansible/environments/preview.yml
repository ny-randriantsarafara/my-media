---
deploy_account: my-media-nonprod
# Plafond d'une preview sur le socle : 1 vCPU / 1024 MiB, job d'initialisation compris.
# Directus démarre en plus de 120 s sous 0,2 vCPU, en 21 s sous 0,7 vCPU (mesuré le 11/10/2026).
instance_limits:
  database: {cpus: 0.1, memory_mib: 192, pids: 128, shared_buffers: 32MB}
  directus: {cpus: 0.7, memory_mib: 448, pids: 256}
  site: {cpus: 0.1, memory_mib: 192, pids: 128}
  provision: {cpus: 0.1, memory_mib: 192, pids: 128}
instance_storage_budget_gib: 2
instance_loads_demo: true
instance_mcp_oauth:
  enabled: false
  cimd_enabled: false
  dcr_enabled: false
  cimd_allowed_domains: ""
  allowed_redirect_domains: ""
