name: Deploy

# Sends one request to the VPS controller through deploy/ansible (ny.vps.app), then checks the public URLs.
on:
  workflow_call:
    inputs:
      environment:
        description: preview or prod.
        type: string
        required: true
      github-environment:
        description: GitHub environment holding the secrets, nonprod or production.
        type: string
        required: true
      operation:
        description: apply or destroy.
        type: string
        default: apply
      pull-request:
        description: Pull request number, previews only.
        type: number
        default: 0
      release:
        description: JSON from images.yml; required for apply.
        type: string
        default: ''
      release-commit:
        description: Selected immutable code commit; required for production.
        type: string
        default: ''
      promotion-run-id:
        description: Trusted main push CI run; required for production.
        type: string
        default: ''
      require-current-main:
        description: Refuse stale main releases during automatic production delivery.
        type: boolean
        default: false
    outputs:
      site-url:
        value: ${{ jobs.deliver.outputs.site-url }}
      cms-url:
        value: ${{ jobs.deliver.outputs.cms-url }}

permissions:
  contents: read
  actions: read

jobs:
  deliver:
    if: >-
      (inputs.environment == 'prod' && inputs.github-environment == 'production'
       && github.ref == 'refs/heads/main' && inputs.release-commit != '' && inputs.promotion-run-id != '')
      || (inputs.environment == 'preview' && inputs.github-environment == 'nonprod'
          && github.event.pull_request.head.repo.full_name == github.repository)
    name: ${{ inputs.operation }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.github-environment }}
      url: ${{ inputs.operation == 'apply' && steps.hosts.outputs.site-url || '' }}
    outputs:
      site-url: ${{ steps.hosts.outputs.site-url }}
      cms-url: ${{ steps.hosts.outputs.cms-url }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      OPERATION: ${{ inputs.operation }}
      PULL_REQUEST: ${{ inputs.pull-request }}
      RELEASE: ${{ inputs.release }}
      PROMOTION_RUN: ${{ inputs.promotion-run-id }}
      REQUIRE_CURRENT_MAIN: ${{ inputs.require-current-main }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-commit || github.sha }}
          persist-credentials: false
      - name: Checkout current trusted production policy
        if: inputs.environment == 'prod'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .delivery-policy
          persist-credentials: false
      - name: Instance hostnames
        id: hosts
        # Same rule as deploy/ansible/deploy.yml (media_label).
        run: |
          case "$TARGET_ENVIRONMENT" in
            prod) label=my-media ;;
            preview) label="my-media-pr-$PULL_REQUEST" ;;
            *) echo "Environnement inconnu : $TARGET_ENVIRONMENT" >&2; exit 1 ;;
          esac
          echo "site-url=https://$label.apps.nyhasinavalona.com" >> "$GITHUB_OUTPUT"
          echo "cms-url=https://cms.$label.apps.nyhasinavalona.com" >> "$GITHUB_OUTPUT"
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - name: Ansible
        run: |
          pip install --require-hashes -r deploy/requirements.txt
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Revalidate production immediately before private inputs
        if: inputs.environment == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_COMMIT: ${{ inputs.release-commit }}
        run: |
          if [[ ! "$PROMOTION_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "Select a numeric CI run ID." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN" > "$RUNNER_TEMP/run.json"
          printf '%s\n' "$RELEASE" > "$RUNNER_TEMP/release.json"
          args=()
          if [[ "$REQUIRE_CURRENT_MAIN" == true ]]; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            args+=(--current-main "$main_sha")
          fi
          python3 .delivery-policy/deploy/validate-promotion.py "$RUNNER_TEMP/run.json" \
            --repository "$GITHUB_REPOSITORY" --run-id "$PROMOTION_RUN" \
            --release "$RUNNER_TEMP/release.json" "${args[@]}" > "$RUNNER_TEMP/validated-release"
          test "$(git rev-parse HEAD)" = "$SELECTED_COMMIT"
          test "$(jq -r '.commit' "$RUNNER_TEMP/release.json")" = "$SELECTED_COMMIT"
      - name: Private inputs
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DIRECTUS_SECRET: ${{ secrets.DIRECTUS_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          EDITOR_PASSWORD: ${{ secrets.EDITOR_PASSWORD }}
          AI_PASSWORD: ${{ secrets.AI_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          EDITOR_EMAIL: ${{ vars.EDITOR_EMAIL }}
          AI_EMAIL: ${{ vars.AI_EMAIL }}
        run: |
          umask 077
          private="$RUNNER_TEMP/delivery"
          mkdir -p "$private"
          if [[ -z "$VPS_SSH_PRIVATE_KEY" ]]; then
            echo "Secret VPS_SSH_PRIVATE_KEY absent de l'environnement GitHub." >&2
            exit 1
          fi
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$private/ssh-key"
          python3 deploy/write-delivery-inputs.py "$private"
          echo "PRIVATE_DIR=$private" >> "$GITHUB_ENV"
      - name: Deliver through vpsctl
        run: |
          ansible-playbook -i deploy/ansible/inventory.yml deploy/ansible/deploy.yml \
            --private-key "$PRIVATE_DIR/ssh-key" \
            -e "@$PRIVATE_DIR/secrets.json" -e "@$PRIVATE_DIR/delivery.json"
      - name: Public checks
        if: inputs.operation == 'apply'
        run: deploy/smoke.sh "${{ steps.hosts.outputs.site-url }}" "${{ steps.hosts.outputs.cms-url }}" --wait 300
      - name: Summary
        if: inputs.operation == 'apply'
        run: |
          {
            echo "### ${{ inputs.environment }}"
            echo
            echo "- Site : ${{ steps.hosts.outputs.site-url }}"
            echo "- CMS : ${{ steps.hosts.outputs.cms-url }}/admin"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/delivery"
