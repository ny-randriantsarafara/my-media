name: Deploy production

# Promote immutable images after trusted main push CI. Never rebuild a release.
# Manual rollback selects an explicit older successful main push CI run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main push CI run to deliver (explicit release or rollback)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Validate the selected release
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push'
              && github.event.workflow_run.head_branch == 'main'
              && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      commit: ${{ steps.release.outputs.sha }}
      run-id: ${{ steps.run.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
      REQUIRE_CURRENT_MAIN: ${{ github.event_name == 'workflow_run' }}
    steps:
      - name: Checkout trusted promotion policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate the CI run
        id: run
        run: |
          if [[ ! "$REQUESTED_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "Select a numeric CI run ID." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN" > "$RUNNER_TEMP/run.json"
          args=()
          if [[ "$REQUIRE_CURRENT_MAIN" == true ]]; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            args+=(--current-main "$main_sha")
          fi
          python3 deploy/validate-promotion.py "$RUNNER_TEMP/run.json" \
            --repository "$GITHUB_REPOSITORY" --run-id "$REQUESTED_RUN" "${args[@]}" >> "$GITHUB_OUTPUT"
          echo "id=$REQUESTED_RUN" >> "$GITHUB_OUTPUT"
      - name: Download its immutable release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/selected-release
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Validate the release commit and images
        id: release
        run: |
          args=()
          if [[ "$REQUIRE_CURRENT_MAIN" == true ]]; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            args+=(--current-main "$main_sha")
          fi
          python3 deploy/validate-promotion.py "$RUNNER_TEMP/run.json" \
            --repository "$GITHUB_REPOSITORY" --run-id "$REQUESTED_RUN" \
            --release "$RUNNER_TEMP/selected-release/release.json" "${args[@]}" >> "$GITHUB_OUTPUT"
          echo "Selected trusted CI run $REQUESTED_RUN." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: release
    # Untrusted/stale triggers must fail release validation before entering this queue.
    concurrency:
      group: production
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      github-environment: production
      release: ${{ needs.release.outputs.release }}
      release-commit: ${{ needs.release.outputs.commit }}
      promotion-run-id: ${{ needs.release.outputs.run-id }}
      require-current-main: ${{ github.event_name == 'workflow_run' }}
    secrets: inherit
